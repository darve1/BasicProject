# 매일 아침(한국 시간 06:17) 할인을 다시 수집하고, 기간 끝난 딜을 내리고, 공식 페이지 변경을 감지한다.
# 사이트는 DB를 바로 읽으므로 따로 배포하지 않아도 반영된다.
# 필요한 저장소 Secrets: NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
name: daily-crawl

on:
  schedule:
    - cron: "17 21 * * *" # UTC 21:17 = KST 06:17
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: crawl
        run: npx tsx crawler/run.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
